<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PD-L1 环肽筛选平台</title><style>
body{margin:0;background:#071425;color:#eaf3ff;font:15px system-ui,"Microsoft YaHei",sans-serif}.app{max-width:1180px;margin:auto;padding:28px 20px 55px}h1{margin:6px 0;font-size:32px}.eyebrow{color:#61d8ff;font-size:12px;letter-spacing:1.6px}.sub{color:#a9bed1;line-height:1.6;max-width:780px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px;margin-top:24px}.panel{background:#10243c;border:1px solid #294864;border-radius:14px;padding:18px}h2{font-size:17px;margin:0 0 12px}label{display:block;font-size:13px;color:#c8d7e8;margin:12px 0 6px}textarea,input{width:100%;box-sizing:border-box;padding:10px;background:#07182a;color:#fff;border:1px solid #3a5875;border-radius:8px;font:inherit}textarea{min-height:82px}.row{display:grid;grid-template-columns:1fr 50px;gap:8px;align-items:center}output{color:#61d8ff;text-align:right}button{width:100%;border:0;border-radius:8px;padding:12px;margin-top:18px;background:#56dabd;color:#062233;font-weight:700;cursor:pointer}.note{margin-top:17px;padding:10px;border-left:3px solid #61d8ff;background:#0b1d31;color:#c1d2e2;font-size:12px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b1d31;border:1px solid #28465f;border-radius:9px;padding:12px}.stat span{font-size:12px;color:#a9bed1}.stat b{display:block;font-size:22px;color:#9de897;margin-top:5px}.hint{margin-top:17px;padding:40px 16px;text-align:center;color:#9db2c8;border:1px dashed #42617c;border-radius:11px}.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}.bar button{width:auto;margin:0;background:#1d435e;color:#e0f4ff;border:1px solid #46708e}.wrap{overflow:auto;border:1px solid #294864;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:730px;font-size:13px}th,td{padding:10px;text-align:left}th{background:#14314e;color:#c2dced}td{border-top:1px solid #25435b}.mono{font-family:Consolas,monospace;font-size:12px}.good{color:#9de897}.bad{color:#ff9c9c}.warning{color:#ffd68a}@media(max-width:860px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><div class="eyebrow">LOCAL · OFFLINE · EXPLORATORY</div><h1>PD-L1 环肽抑制剂筛选平台</h1><div class="sub">离线候选生成与多目标优先级排序。无需安装任何环境，双击本文件即可使用。</div><section class="grid"><section class="panel"><h2>筛选参数</h2><label>种子序列 / HELM</label><textarea id="seed">PEPTIDE1{A.C.L.V.I.F.W.Y}$$$$</textarea><label>候选数量（10–300）</label><input id="count" type="number" min="10" max="300" value="80"><h2 style="margin-top:24px">优化权重</h2><div id="controls"></div><button id="run">运行候选筛选</button><div class="note"><b>科学限制：</b>本离线版本采用透明的规则型序列特征进行相对排序；不代表 PD-L1 结合活性、ADMET 或实验结论，须经验证模型、对接和湿实验确认。</div></section><section><div id="stats" class="stats"><div class="stat"><span>候选数</span><b>—</b></div><div class="stat"><span>最佳优先级</span><b>—</b></div><div class="stat"><span>平均拟合亲和力</span><b>—</b></div><div class="stat"><span>通过初筛</span><b>—</b></div></div><div class="hint" id="hint">设置种子序列与权重，然后点击“运行候选筛选”。<br><small>支持 HELM：PEPTIDE1{A.C.L.V}$$$$ 或单字母序列。</small></div><div id="result" hidden><div class="bar"><div><b>候选优先级列表</b><div id="status" style="color:#a9bed1;font-size:12px;margin-top:4px"></div></div><button id="export">导出 CSV</button></div><div class="wrap"><table><thead><tr><th>排名</th><th>环肽序列</th><th>拟合亲和力</th><th>渗透性</th><th>毒性风险</th><th>药物相似性</th><th>优先级</th><th>提示</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></section></main><script>
const A='ACDEFGHIKLMNPQRSTVWY',H=new Set('AVILMFWY'),P=new Set('STNQCH'),C=new Set('DEKR');let data=[];const D={affinity:['结合优先级',.4],permeability:['渗透性',.3],toxicity:['低毒性',.15],druglikeness:['药物相似性',.15]};const ctl=document.querySelector('#controls');Object.entries(D).forEach(([k,[n,v]])=>{ctl.insertAdjacentHTML('beforeend',`<label>${n}</label><div class="row"><input id="${k}" type="range" min="0" max="100" value="${v*100}"><output id="${k}v">${v.toFixed(2)}</output></div>`);document.querySelector('#'+k).oninput=e=>document.querySelector('#'+k+'v').textContent=(e.target.value/100).toFixed(2)});const sig=x=>1/(1+Math.exp(-Math.max(-30,Math.min(30,x))));function parse(v){v=v.trim();let m=v.match(/^PEPTIDE1\{([A-Za-z.]+)\}\$\$\$\$$/);let s=m?m[1].split('.').join(''):v.replace(/[^A-Za-z]/g,'').toUpperCase();if(s.length<5||s.length>40||[...s].some(x=>!A.includes(x)))throw Error('请输入 5–40 个标准氨基酸的 HELM 或单字母序列。');return s}function calc(s,w){let n=s.length,f=z=>[...s].filter(x=>z.has(x)).length/n,hy=f(H),po=f(P),ch=f(C),ar=[...s].filter(x=>'FWY'.includes(x)).length/n,pr=[...s].filter(x=>x==='P').length/n,cy=[...s].filter(x=>x==='C').length/n,di=new Set(s).size/Math.min(n,20),af=-5.2-2.8*hy-ar+0.7*ch+.35*pr,pe=sig(2.2*hy+.5*ar-2.4*ch-.25*(n-10)),to=sig(2*ar+hy+.8*cy-1.55),dr=Math.max(0,Math.min(1,.88-Math.abs(n-9)*.035-ch*.2+di*.12)),re=Math.max(0,1-Math.abs(af+8)/4),rw=w.affinity*re+w.permeability*pe+w.toxicity*(1-to)+w.druglikeness*dr,fl=[];if(n*110>1200)fl.push('估算 MW 偏高');if(ch>.3)fl.push('带电残基偏高');if(to>.65)fl.push('结构性风险提示');return{sequence:s,helm:'PEPTIDE1{'+[...s].join('.')+'}$$$$',affinity:af,permeability:pe,toxicity:to,druglikeness:dr,reward:rw,flags:fl}}function mut(s){let a=[...s],k=Math.random()<.7?'r':Math.random()<.85?'i':'d';if(k==='r')a[Math.floor(Math.random()*a.length)]=A[Math.floor(Math.random()*A.length)];else if(k==='i'&&a.length<20)a.splice(Math.floor(Math.random()*(a.length+1)),0,A[Math.floor(Math.random()*A.length)]);else if(a.length>6)a.splice(Math.floor(Math.random()*a.length),1);return a.join('')}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelector('#run').onclick=()=>{try{let seed=parse(document.querySelector('#seed').value),num=Math.max(10,Math.min(300,+document.querySelector('#count').value||80)),w=Object.fromEntries(Object.keys(D).map(k=>[k,+document.querySelector('#'+k).value/100])),sum=Object.values(w).reduce((a,b)=>a+b)||1;Object.keys(w).forEach(k=>w[k]/=sum);let pool=[seed],seen=new Set(pool);for(let i=0;i<num*8&&pool.length<num*2;i++){let s=mut(pool[Math.floor(Math.random()*pool.length)]);if(!seen.has(s)){pool.push(s);seen.add(s)}}data=pool.map(s=>calc(s,w)).sort((a,b)=>b.reward-a.reward).slice(0,num);data.forEach((x,i)=>x.rank=i+1);let avg=data.reduce((z,x)=>z+x.affinity,0)/data.length,pass=data.filter(x=>x.affinity<=-7&&x.permeability>=.45&&x.toxicity<.55).length;document.querySelector('#stats').innerHTML=`<div class="stat"><span>候选数</span><b>${data.length}</b></div><div class="stat"><span>最佳优先级</span><b>${data[0].reward.toFixed(3)}</b></div><div class="stat"><span>平均拟合亲和力</span><b>${avg.toFixed(2)}</b></div><div class="stat"><span>通过初筛</span><b>${pass}</b></div>`;document.querySelector('#rows').innerHTML=data.map(x=>`<tr><td>${x.rank}</td><td class="mono">${esc(x.helm)}</td><td class="good">${x.affinity.toFixed(2)}</td><td>${x.permeability.toFixed(3)}</td><td class="${x.toxicity>.6?'bad':''}">${x.toxicity.toFixed(3)}</td><td>${x.druglikeness.toFixed(3)}</td><td><b>${x.reward.toFixed(4)}</b></td><td class="warning">${esc(x.flags.join('；')||'—')}</td></tr>`).join('');document.querySelector('#hint').hidden=true;document.querySelector('#result').hidden=false;document.querySelector('#status').textContent='本次结果仅保留在当前浏览器会话中'}catch(e){alert(e.message)}};document.querySelector('#export').onclick=()=>{if(!data.length)return;let head=['rank','sequence','helm','affinity','permeability','toxicity','druglikeness','reward','flags'],csv=[head.join(',')].concat(data.map(x=>head.map(k=>'"'+String(k==='flags'?x[k].join(';'):x[k]).replaceAll('"','""')+'"').join(','))).join('\n'),b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='pd-l1-cyclopeptide-candidates.csv';a.click();URL.revokeObjectURL(u)};
</script></body></html>
